<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="ht hd">
<title id="ht">How Eccles WASM runs a module</title>
<desc id="hd">A .wasm file is streamed from storage in small chunks, validated and translated, executed by a fused-instruction interpreter with fuel and bounds checks, and reaches the chip through a portable hardware API. Everything lives in one fixed arena.</desc>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}</style>
<defs>
<linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
<linearGradient id="ach" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="gvh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="gch" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dotsh" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#94a3b8" opacity=".14"/></pattern>
</defs>
<rect width="1000" height="500" rx="22" fill="url(#bgh)"/>
<rect width="1000" height="500" rx="22" fill="url(#dotsh)"/>
<text x="50" y="52" class="m" font-size="14" fill="#94a3b8" letter-spacing="1">PIPELINE  ·  file to pins</text>
<rect x="50" y="84" width="160" height="96" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="1.6"/><text x="130.0" y="124" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#22d3ee">.wasm</text><text x="130.0" y="148" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">flash · FS</text><text x="130.0" y="164" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">SD · OTA</text><path d="M214 132 h15 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="235" y="84" width="160" height="96" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="1.6"/><text x="315.0" y="124" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#22d3ee">Stream loader</text><text x="315.0" y="148" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">256 B chunks, never</text><text x="315.0" y="164" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">whole in RAM</text><path d="M399 132 h15 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="84" width="160" height="96" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-width="1.6"/><text x="500.0" y="124" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#818cf8">Translator</text><text x="500.0" y="152" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">checks, links imports</text><path d="M584 132 h15 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="605" y="84" width="160" height="96" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-width="1.6"/><text x="685.0" y="124" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#818cf8">Interpreter</text><text x="685.0" y="152" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">fused ops, fuel, traps</text><path d="M769 132 h15 m-6 -5 l6 5 l-6 5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="84" width="160" height="96" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="1.6"/><text x="870.0" y="124" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#a78bfa">Hardware API</text><text x="870.0" y="148" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">enable · adc</text><text x="870.0" y="164" text-anchor="middle" class="m" font-size="11.5" fill="#94a3b8">i2c · spi · uart</text><text x="50" y="244" class="m" font-size="14" fill="#94a3b8" letter-spacing="1">ONE ARENA  ·  ECCLES_WASM_ARENA_SIZE</text><rect x="50" y="260" width="86" height="58" rx="10" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="1.6"/><text x="93.0" y="295" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#22d3ee">instance</text><rect x="140" y="260" width="86" height="58" rx="10" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="1.6"/><text x="183.0" y="295" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#22d3ee">metadata</text><rect x="230" y="260" width="166" height="58" rx="10" fill="#818cf8" fill-opacity=".14" stroke="#818cf8" stroke-width="1.6"/><text x="313.0" y="295" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#818cf8">translated code</text><rect x="400" y="260" width="86" height="58" rx="10" fill="#818cf8" fill-opacity=".14" stroke="#818cf8" stroke-width="1.6"/><text x="443.0" y="295" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#818cf8">stacks</text><rect x="490" y="260" width="456" height="58" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="1.6"/><text x="718.0" y="295" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#a78bfa">guest linear memory</text><text x="500" y="368" text-anchor="middle" class="t" font-size="16" fill="#e2e8f0">Every memory access and call is <tspan font-weight="700" fill="#22d3ee">bounds-checked</tspan>. A hostile module can only trap.</text><text x="500" y="394" text-anchor="middle" class="t" font-size="15" fill="#94a3b8">Hardware calls answer <tspan class="m" fill="#34d399">SUCCESSFUL</tspan> · <tspan class="m" fill="#f87171">FAILED</tspan> · <tspan class="m" fill="#fbbf24">UNSUPPORTED</tspan>, so one binary adapts to the board.</text><rect x="60" y="424" width="880" height="48" rx="12" fill="#0f172a" stroke="#334155"/><text x="500" y="454" text-anchor="middle" class="m" font-size="15" fill="#e2e8f0">eccles_wasm_load(<tspan fill="#22d3ee">"/app.wasm"</tspan>);  eccles_wasm_run(<tspan fill="#22d3ee">"loop"</tspan>);</text>
</svg>
