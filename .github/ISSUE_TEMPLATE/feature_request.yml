name: Feature request
description: Suggest an improvement, a WebAssembly feature or a new hardware backend
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Which chip, board or toolchain is this for?
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how it could work
