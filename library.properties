name=EcclesWasm
version=1.1.0
author=Nwobodo Ecclesiastes
maintainer=Nwobodo Ecclesiastes <igwestarking21@gmail.com>
sentence=WebAssembly executor for microcontrollers. Load a .wasm from a file and run it.
paragraph=Plain C99 interpreter with a streaming loader, structural validation, fuel limits and a portable hardware API (enable, disable, sleep, analog, adc, i2c, spi, uart ...) that returns SUCCESSFUL, FAILED or UNSUPPORTED on every chip. Needs ~100 KB RAM for stock modules, less with ECCLES_WASM_MEM_LIMIT_BYTES.
